[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-wrapper"
version = "0.1.0"
description = "A Jev-style 'System One' decision API wrapper on top of chat models (GPT-6 Luna, GPT-5.4-mini, ...), with pluggable reasoning-effort modes and a benchmark harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]
datasets = [
  "pyarrow>=16.0",
]
warm = [
  "github-copilot-sdk==1.0.15; python_version >= '3.11'",
]
local = [
  "laya==0.3.21",
  "gliner2==2.0.0",
  "transformers>=4.48,<5",
  "peft>=0.17,<0.19",
  "protobuf>=5",
]

[project.scripts]
decision-wrapper = "decision_wrapper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_wrapper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
